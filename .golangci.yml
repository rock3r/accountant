version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - net/http.ResponseWriter.Write
    revive:
      rules:
        - name: exported
          disabled: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
